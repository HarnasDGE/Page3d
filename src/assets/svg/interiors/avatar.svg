<svg xmlns="http://www.w3.org/2000/svg" width="480" height="600" viewBox="0 0 480 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1460"/>
      <stop offset="1" stop-color="#0b0620"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9c7b5"/>
      <stop offset="1" stop-color="#b98a78"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="480" height="600" fill="url(#bg)"/>
  <circle cx="240" cy="250" r="190" fill="#8b5cff" opacity="0.15"/>
  <!-- Shoulders / hoodie -->
  <path d="M60 600 C70 470 150 420 240 420 C330 420 410 470 420 600 Z" fill="#1c1838"/>
  <path d="M190 430 L240 500 L290 430" fill="none" stroke="#00f0ff" stroke-width="6" filter="url(#glow)"/>
  <!-- Neck and head -->
  <rect x="208" y="360" width="64" height="80" rx="20" fill="#b98a78"/>
  <ellipse cx="240" cy="270" rx="100" ry="120" fill="url(#skin)"/>
  <!-- Hair -->
  <path d="M138 250 C130 150 190 120 250 128 C320 136 352 180 342 250 C330 200 300 186 250 190 C200 194 160 200 138 250 Z" fill="#1a1428"/>
  <!-- Glasses -->
  <g fill="none" stroke="#00f0ff" stroke-width="6" filter="url(#glow)">
    <rect x="160" y="250" width="68" height="44" rx="12"/>
    <rect x="252" y="250" width="68" height="44" rx="12"/>
    <path d="M228 270 H252"/>
  </g>
  <path d="M212 338 Q240 356 268 338" fill="none" stroke="#6e4a40" stroke-width="5" stroke-linecap="round"/>
  <!-- Headphones -->
  <path d="M130 270 C130 150 350 150 350 270" fill="none" stroke="#ff2bd6" stroke-width="12" filter="url(#glow)"/>
  <rect x="116" y="250" width="30" height="64" rx="12" fill="#ff2bd6"/>
  <rect x="334" y="250" width="30" height="64" rx="12" fill="#ff2bd6"/>
</svg>
