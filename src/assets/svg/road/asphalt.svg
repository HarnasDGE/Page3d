<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Fine grain; stitchTiles keeps the tile seamless. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.62  0 0 0 0 0.6  0 0 0 0 0.72  0 0 0 0.9 -0.28"/>
    </filter>
    <!-- Large darker repair patches. -->
    <filter id="patches" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="2" seed="11" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.02  0 0 0 0 0.02  0 0 0 0 0.04  0 0 0 6 -3.1"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#1b1830"/>
  <rect width="512" height="512" filter="url(#patches)"/>
  <rect width="512" height="512" filter="url(#grain)" opacity="0.55"/>
  <g fill="none" stroke="#0b0a16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 90 L92 118 L120 110 L168 150 L190 196" stroke-width="2.2"/>
    <path d="M120 110 L128 76" stroke-width="1.4"/>
    <path d="M330 300 L372 328 L380 372 L430 396 L470 450" stroke-width="2"/>
    <path d="M380 372 L352 404" stroke-width="1.3"/>
    <path d="M250 470 L276 488 L300 512" stroke-width="1.6"/>
    <path d="M250 0 L262 18 L290 30" stroke-width="1.6"/>
  </g>
</svg>
